name: Build DreamStudioAI Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias dreamstudio \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass dreamstudio123 \
            -keypass dreamstudio123 \
            -dname "CN=DreamStudioAI, OU=DreamStudioAI, O=DreamStudioAI, L=Jordan, S=Jordan, C=JO"

      - name: Build signed Release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-key.jks \
            -Pandroid.injected.signing.store.password=dreamstudio123 \
            -Pandroid.injected.signing.key.alias=dreamstudio \
            -Pandroid.injected.signing.key.password=dreamstudio123

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DreamStudioAI-release-apk
          path: app/build/outputs/apk/release/app-release.apk
